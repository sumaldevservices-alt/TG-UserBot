version: '3.8'

services:
  userbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg_userbot_pro
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist session and configuration across container restarts
      - ./data:/app/data
      - ./downloads:/app/downloads
      - ./temp:/app/temp
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
