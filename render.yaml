services:
  - type: worker
    name: tg-userbot-pro
    runtime: python
    region: oregon
    plan: starter
    buildCommand: "pip install -U pip && pip install -r requirements.txt"
    startCommand: "python userbot.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: OWNER_ID
        sync: false
      - key: SESSION_STRING
        sync: false
